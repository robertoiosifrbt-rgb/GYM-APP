name: Deploy to GitHub Pages

# Publishing happens from `main` and from the `claude/**` work branches.
#
# The audit asked for work branches to stop publishing, because an unfinished
# version could reach the live app. Owner's decision was to keep publishing
# from the branch being worked on — for a one-person app, needing a merge to
# get the app onto a phone costs more than it protects.
#
# What replaces that protection: lint and the test suite run BEFORE the
# artifact is built, so a broken push publishes nothing at all. That covers the
# real risk (broken code going live). What it does not cover: two branches
# pushed close together still publish in whatever order they finish, so treat
# whichever branch you push as the live one.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a publish that is already running: an interrupted deployment
  # decided by whichever run happens to finish first is exactly what we are
  # trying to avoid.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # Every check runs before the artifact is produced, so a failure here
      # means nothing is uploaded and the deploy job never gets its input.
      - run: npm run lint
      - run: npm test

      - id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.version.outputs.sha }}" > public/version.txt
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ steps.version.outputs.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
