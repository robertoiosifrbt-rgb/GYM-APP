name: Deploy to GitHub Pages

# Publishing happens only from `main`.
#
# The initial design allowed `claude/**` branches to publish, but after audit
# review the risk is not justified: an in-progress branch could reach the live
# app without passing through dev or main first.
#
# `claude/**` branches still run lint, test, and build (in ci.yml) for
# validation, but no artifact is deployed to GitHub Pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a publish that is already running: an interrupted deployment
  # decided by whichever run happens to finish first is exactly what we are
  # trying to avoid.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # Every check runs before the artifact is produced, so a failure here
      # means nothing is uploaded and the deploy job never gets its input.
      - run: npm run lint
      - run: npm test

      - id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.version.outputs.sha }}" > public/version.txt
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ steps.version.outputs.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
