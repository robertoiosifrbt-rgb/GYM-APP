name: Deploy to GitHub Pages

# Publishing to the live site happens from `main` only.
#
# This used to also run for `claude/**`, which meant any push to a work branch
# replaced the live app — an unfinished version could go out, and a verified
# one could be overwritten by an experiment. Work branches now run `ci.yml`
# (lint + test + build) and reach the live site only by being merged here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a publish that is already running: an interrupted deployment
  # decided by whichever run happens to finish first is exactly what we are
  # trying to avoid.
  cancel-in-progress: false

jobs:
  build:
    # Belt and braces for workflow_dispatch, which can be started from any ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # Every check runs before the artifact is produced, so a failure here
      # means nothing is uploaded and the deploy job never gets its input.
      - run: npm run lint
      - run: npm test

      - id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ steps.version.outputs.sha }}" > public/version.txt
      - run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ steps.version.outputs.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
