name: CI

# Checks for pull requests and for branches that do not publish.
#
# `main` and `claude/**` are covered by deploy.yml, which runs the same lint +
# test + build before it publishes — listing them here too would just run
# everything twice per push.
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
