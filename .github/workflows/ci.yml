name: CI

# Checks for pull requests and for branches that do not publish to GitHub Pages.
#
# `main` is covered by deploy.yml (which runs lint + test + build before
# publishing). `claude/**` branches run here instead, to validate without
# deploying.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
